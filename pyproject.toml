[project]
name = "vi-diacritics"
version = "0.1.0"
description = "Thêm dấu tiếng Việt bằng Transformer tự viết từ đầu (PyTorch), chạy ONNX trên CPU và trên trình duyệt"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tiến Dương", email = "duongcodeai2@gmail.com" }]
dependencies = []

[project.optional-dependencies]
infer = ["numpy>=1.26", "onnxruntime>=1.18"]
train = ["torch>=2.2", "numpy>=1.26", "tokenizers>=0.19", "datasets>=2.19", "matplotlib>=3.8", "tqdm"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
